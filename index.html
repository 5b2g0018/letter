<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>給 映瑄 的一封信 💌</title>
    <meta name="description" content="給映瑄的特別專屬互動信件！包含 TWICE Be as ONE 經典音樂與拍立得回憶照片。">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

    <!-- Main App Container -->
    <div id="app-container">
        
        <!-- Canvas for Heart & Sparkle Particle Engine -->
        <canvas id="particles-canvas"></canvas>

        <!-- Ambient Floating Sparkle Icons -->
        <div class="ambient-sparkles">
            <span class="sparkle-icon" style="top: 10%; left: 6%; animation-delay: 0s;">✨</span>
            <span class="sparkle-icon" style="top: 24%; right: 10%; animation-delay: 0.7s;">💙</span>
            <span class="sparkle-icon" style="bottom: 22%; left: 8%; animation-delay: 1.2s;">🪄</span>
            <span class="sparkle-icon" style="bottom: 14%; right: 8%; animation-delay: 0.4s;">✨</span>
            <span class="sparkle-icon" style="top: 48%; left: 5%; animation-delay: 1.8s;">🦌</span>
            <span class="sparkle-icon" style="top: 35%; right: 6%; animation-delay: 0.9s;">✨</span>
            <span class="sparkle-icon" style="bottom: 28%; left: 12%; animation-delay: 1.5s;">💎</span>
            <span class="sparkle-icon" style="top: 7%; left: 50%; animation-delay: 2.1s;">💙</span>
        </div>

        <!-- Top Navigation & Music Player Bar -->
        <header class="top-nav">
            <div class="brand-badge">
                <span class="brand-icon">💙</span>
                <span>TWICE - Be as ONE 💌</span>
            </div>
            <div class="nav-actions">
                <button id="bgm-toggle-btn" class="action-btn" title="播放/暫停 Be as ONE 背景音樂">
                    <span id="bgm-icon">🎵</span>
                    <span id="bgm-text">Be as ONE: OFF</span>
                </button>
            </div>
        </header>

        <!-- Audio Element for TWICE Be as ONE -->
        <audio id="be-as-one-audio" preload="auto" loop>
            <source src="Be_as_ONE.mp4" type="audio/mp4">
            <source src="Be_as_ONE.mp4" type="audio/mpeg">
        </audio>

        <!-- Central 3D Envelope Stage -->
        <main class="stage-3d">
            <div id="envelope-wrapper" class="envelope-wrapper" onclick="openEnvelope(event)">
                <div class="envelope">
                    <!-- Envelope Backing -->
                    <div class="envelope-back"></div>

                    <!-- Envelope Fold Flaps -->
                    <div class="flap-left"></div>
                    <div class="flap-right"></div>
                    <div class="flap-bottom"></div>
                    <div id="flap-top" class="flap-top"></div>

                    <!-- TWICE Wax Seal Button -->
                    <div id="wax-seal" class="wax-seal" title="點擊開啟信件">
                        <div class="wax-seal-inner">
                            <span>TWICE</span>
                        </div>
                    </div>

                    <!-- Envelope Cover Header Content (Positioned cleanly below Wax Seal) -->
                    <div id="cover-text" class="cover-text">
                        <h2 class="cover-recipient-title">給 <span id="cover-recipient-name">映瑄</span> 的一封信 💌</h2>
                        <p class="cover-subtitle">點擊信封解鎖專屬驚喜 ✨</p>
                    </div>
                </div>

                <!-- Open Prompt Tag -->
                <div class="open-prompt-tag">
                    ✨ 點擊信封開啟專屬驚喜 💌
                </div>
            </div>
        </main>

        <!-- The Letter Card (Standalone Modal Window) -->
        <article id="letter-paper" class="letter-paper-modal">
            <button id="close-letter-btn" class="close-letter-btn" title="關閉信件" onclick="closeEnvelope()">&times;</button>
            
            <div class="letter-inner-content">
                <!-- Header with Title & Stamps -->
                <div class="letter-header-decor">
                    <div class="badge-tag">
                        💙 TZUYU LOVELY LETTER
                    </div>
                    <div id="letter-stamps" class="letter-stamps">
                        <!-- Populated dynamically with mini Lovely stamps -->
                    </div>
                </div>

                <!-- Recipient Line -->
                <div class="letter-recipient">
                    Dear <span id="letter-recipient-text">映瑄</span> 👋，
                </div>

                <!-- Letter Body Message -->
                <div id="letter-body-text" class="letter-body">
展信快樂！這是一封特別為妳製作的專屬互動信件 ✨。

祝妳每天都能像 TWICE 的歌一樣充滿能量，遇到的所有程式碼都不卡 bug，要一直保持笑口常開喔！狂熱女團魂不滅 🍭💙！
                </div>

                <!-- Polaroid Photo Memory Section -->
                <div id="polaroid-frame" class="polaroid-container">
                    <img id="polaroid-img" class="polaroid-img" src="https://zeekmagazine.com/wp-content/uploads/2025/09/1758345362-a18c6653ff456bdab53dfefd9d513967.jpg" alt="Special Memory Photo">
                    <div id="polaroid-caption" class="polaroid-caption">Be as ONE ✨ TWICE 💙</div>
                </div>

                <!-- Letter Footer & Sender -->
                <div class="letter-footer">
                    <div class="letter-date" id="letter-date-text">2026.09.05</div>
                    <div class="letter-sender">
                        Best wishes, <span id="letter-sender-text">松鼠 🐿️</span>
                    </div>
                </div>

                <!-- Interactive Lovelys Bar Inside Letter -->
                <div class="letter-lovelys-footer-bar">
                    <span class="bar-hint">
                        點擊下方 TWICE Lovely 給你特別祝福與愛心雨 🌸
                    </span>
                    <div id="inner-lovelys-list" class="inner-lovelys-flex">
                        <!-- Dynamic mini Lovely SVGs -->
                    </div>
                </div>
            </div>
        </article>

        <!-- Dark Glass Modal Backdrop -->
        <div id="modal-overlay" onclick="closeEnvelope()"></div>

        <!-- Toast Notification Popup -->
        <div id="toast-notification" class="toast-notification"></div>

    </div>

    <!-- Scripts -->
    <script src="lovelys.js?v=2"></script>
    <script src="app.js?v=2"></script>
</body>
</html>
